<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Cryptic Blue-Line Discovery Lab</title><style>
:root{color-scheme:dark}body{margin:0;background:#05070a;color:#d9f7ff;font:14px ui-monospace,monospace}.top{padding:18px;border-bottom:1px solid #123}.blue{height:2px;background:#32b7ff;box-shadow:0 0 18px #32b7ff;transform-origin:left;animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.35;transform:scaleX(.82)}}main{padding:18px;max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.card{border:1px solid #173246;padding:12px;background:#071018}.score{font-size:24px}pre{white-space:pre-wrap}.pulse{outline:1px solid #32b7ff}
</style></head><body><div class="top">CRYPTIC // LIVE BREAK + DISCOVER <span id="status">CONNECTING</span></div><div class="blue"></div><main><h2>Blue-Line Hot State</h2><p>No refresh: Server-Sent Events patch this DOM in place. SIMULATED is never promoted as production proof.</p><div id="grid" class="grid"></div><pre id="log"></pre></main><script>
const grid=document.querySelector("#grid"),log=document.querySelector("#log"),status=document.querySelector("#status");
function patch(m){status.textContent="LIVE • "+m.evidence_state;const arms=m.snapshot?.state||[];for(const a of arms){let el=document.getElementById("arm-"+a.name);if(!el){el=document.createElement("div");el.id="arm-"+a.name;el.className="card";grid.append(el)}el.innerHTML=`<b>${a.name}</b><div class=score>${a.score.toFixed(5)}</div><small>pulls ${a.pulls}</small>`;el.classList.remove("pulse");void el.offsetWidth;el.classList.add("pulse")}log.textContent=JSON.stringify({iteration:m.iteration,selected:m.selected,reward:m.reward,hash:m.snapshot?.sha256},null,2)}
const es=new EventSource("/events");es.addEventListener("blue-line",e=>patch(JSON.parse(e.data)));es.addEventListener("ready",()=>status.textContent="LIVE");es.onerror=()=>status.textContent="RECONNECTING";
</script></body></html>
